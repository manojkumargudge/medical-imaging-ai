name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # CPU-only torch: the pins match the +cpu builds on this index, and the CUDA builds on
        # PyPI would add gigabytes of downloads that the CPU tests do not need.
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: python -m mypy
      - name: Tests
        # Real-data tests skip here: data/ is not in git.
        run: python -m pytest
