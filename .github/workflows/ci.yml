name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # CPU-only torch: the pins match the +cpu builds on this index, and the CUDA builds on
        # PyPI would add gigabytes of downloads that the CPU tests do not need.
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: python -m mypy
      - name: Tests
        # Real-data tests skip here: data/ is not in git.
        run: python -m pytest

  integration:
    # Orthanc and the results Postgres from docker-compose.yml, with synthetic data only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: python -m pip install -e ".[dev]"
      - name: Start services
        run: |
          sed -e "s/^ORTHANC_PASSWORD=.*/ORTHANC_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^RESULTS_DB_PASSWORD=.*/RESULTS_DB_PASSWORD=$(openssl rand -hex 16)/" \
              .env.example > .env
          docker compose up -d --wait
      - name: Integration tests
        env:
          AIML02_INTEGRATION: "1"
        run: python -m pytest -m integration -s
      - name: Service logs
        if: failure()
        run: docker compose logs
