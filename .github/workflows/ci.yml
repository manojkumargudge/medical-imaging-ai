name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # CPU-only torch: the pins match the +cpu builds on this index, and the CUDA builds on
        # PyPI would add gigabytes of downloads that the CPU tests do not need.
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: python -m pip install -e ".[dev,api]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: python -m mypy
      - name: Tests
        # Real-data tests skip here: data/ is not in git.
        run: python -m pytest

  frontend:
    # The React viewer: types, Vitest, production build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  integration:
    # Orthanc and the results Postgres from docker-compose.yml as the separate test project
    # (aiml02-test, .env.test), with synthetic data only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: python -m pip install -e ".[dev,api]"
      - name: Start the test stack
        # With the API (Dockerfile.api) and frontend (frontend/Dockerfile) containers.
        run: |
          python -m scripts.make_test_env
          docker compose -p aiml02-test --env-file .env.test -f docker-compose.yml \
            -f docker-compose.api.yml -f docker-compose.frontend.yml up -d --build --wait
          python -m src.service.migrate --env-file .env.test
      - name: Integration tests
        env:
          AIML02_INTEGRATION: "1"
        run: python -m pytest -m integration -s
      - name: Service logs
        if: failure()
        run: |
          docker compose -p aiml02-test --env-file .env.test -f docker-compose.yml \
            -f docker-compose.api.yml -f docker-compose.frontend.yml logs
