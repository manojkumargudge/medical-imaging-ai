# The inference worker, added to docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml up -d --build
# CLASSIFIER_CHECKPOINT and SEGMENTATION_CHECKPOINT in .env are paths on this machine, outside
# the repository; each file is mounted read-only. Checkpoints are never in the image or in git.

services:
  worker:
    build: .
    image: aiml02-worker:local
    restart: unless-stopped
    depends_on:
      orthanc:
        condition: service_healthy
      results-db:
        condition: service_healthy
    environment:
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
      RESULTS_DB_URL: postgresql://aiml02:${RESULTS_DB_PASSWORD}@results-db:5432/aiml02_results
      CLASSIFIER_CHECKPOINT: /checkpoints/classifier.pt
      SEGMENTATION_CHECKPOINT: /checkpoints/segmentation.pt
      RESULTS_DIR: /results
      WORKER_THREADS: "4"
    volumes:
      - ${CLASSIFIER_CHECKPOINT:?set CLASSIFIER_CHECKPOINT in .env}:/checkpoints/classifier.pt:ro
      - ${SEGMENTATION_CHECKPOINT:?set SEGMENTATION_CHECKPOINT in .env}:/checkpoints/segmentation.pt:ro
      - ${WORKER_RESULTS_DIR:-./results/worker}:/results
