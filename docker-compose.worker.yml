# The inference worker, added to docker-compose.base.yml (compose.yaml starts the whole demo stack):
#   docker compose -f docker-compose.base.yml -f docker-compose.worker.yml up -d --build
# CLASSIFIER_CHECKPOINT and SEGMENTATION_CHECKPOINT in .env are paths on this machine, outside
# the repository; each file is mounted read-only. Checkpoints are never in the image or in git.

services:
  worker:
    build: .
    image: aiml02-worker:local
    restart: unless-stopped
    depends_on:
      orthanc:
        condition: service_healthy
      results-db:
        condition: service_healthy
    environment:
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
      RESULTS_DB_URL: postgresql://aiml02:${RESULTS_DB_PASSWORD}@results-db:5432/${RESULTS_DB_NAME:-aiml02_results}
      CLASSIFIER_CHECKPOINT: /checkpoints/classifier.pt
      SEGMENTATION_CHECKPOINT: /checkpoints/segmentation.pt
      RESULTS_DIR: /results
      WORKER_THREADS: "4"
      WORKER_HEARTBEAT: /tmp/worker-heartbeat
    # The worker serves no HTTP: healthy while it has touched its heartbeat file in the last 5
    # minutes. It touches it after loading the models, after each study and after each poll (a
    # CT study takes up to about 95 s on this laptop). start_period covers the model load.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 300)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    volumes:
      - ${CLASSIFIER_CHECKPOINT:?set CLASSIFIER_CHECKPOINT in .env}:/checkpoints/classifier.pt:ro
      - ${SEGMENTATION_CHECKPOINT:?set SEGMENTATION_CHECKPOINT in .env}:/checkpoints/segmentation.pt:ro
      - ${WORKER_RESULTS_DIR:-./results/worker}:/results
