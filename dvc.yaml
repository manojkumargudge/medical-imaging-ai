stages:
  split:
    # Standard library only: any Python 3.11 named `python` on the path can run it.
    cmd: >-
      python -m src.data.split
      --data-entry data/raw/Data_Entry_2017.csv
      --train-val-list data/raw/train_val_list.txt
      --test-list data/raw/test_list.txt
      --out-dir data/splits
      --seed ${split.seed}
      --val-fraction ${split.val_fraction}
    deps:
      - data/raw/Data_Entry_2017.csv
      - data/raw/train_val_list.txt
      - data/raw/test_list.txt
      - src/data/split.py
    params:
      - split.seed
      - split.val_fraction
    outs:
      - data/splits
  preprocess:
    # Runs on Colab (Linux): the shell expands $NIH_ZIP (the Kaggle zip, about 45 GB, not a dep
    # because hashing it is slow and it is deleted afterwards) and $AIML02_RESUME_DIR (a VM folder
    # that survives a failed run; empty = build straight into the output folder). All outputs go
    # to the VM disk; `dvc push` copies them to the Drive remote.
    cmd: >-
      python -m src.data.preprocess
      --zip "$NIH_ZIP"
      --splits-dir data/splits
      --out-dir data/processed/nih_224
      --manifest data/manifests/nih_224.csv
      --work-dir data/cache/preprocess
      --resume-dir "$AIML02_RESUME_DIR"
      --params params.yaml
    deps:
      - data/splits
      - src/data/preprocess.py
      - src/data/split.py
    params:
      - preprocess.image_size
      - preprocess.shard_size
      - preprocess.mean
      - preprocess.std
    outs:
      - data/processed/nih_224
      - data/manifests/nih_224.csv
  seg_split:
    # MSD Task09_Spleen, labelled cases only. Only dataset.json is a dep: the split depends on the
    # case list, not on the 1.5 GB of volumes (downloaded with an md5 check, not tracked by DVC).
    cmd: >-
      python -m src.data.spleen split
      --task-dir data/raw/Task09_Spleen
      --out data/seg_splits/spleen.csv
      --seed ${seg_split.seed}
      --val-fraction ${seg_split.val_fraction}
      --test-fraction ${seg_split.test_fraction}
    deps:
      - data/raw/Task09_Spleen/dataset.json
      - src/data/spleen.py
      - src/data/split.py
    params:
      - seg_split.seed
      - seg_split.val_fraction
      - seg_split.test_fraction
    outs:
      - data/seg_splits/spleen.csv
