[project]
name = "medical-imaging-ai"
version = "0.1.0"
description = "Medical imaging AI (AIML-02). For education only, not for clinical use."
requires-python = ">=3.11,<3.12"
readme = "README.md"
# Pinned for local Python 3.11 and CI. On Colab the notebooks use Colab's own torch build (with
# CUDA) and record its version in the checkpoints and the report.
dependencies = [
    "numpy==2.4.6",
    "monai==1.6.1",
    "nibabel==5.4.2",
    "pandas==3.1.0",
    "pillow==13.0.0",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "torch==2.15.0",
    "torchvision==0.29.2",
]

[project.optional-dependencies]
dev = [
    "dvc==3.67.1",
    # kaggle 2.2.5 imports six without declaring it.
    "kaggle==2.2.5",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "six==1.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PD"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# No pandas-stubs: they add little here and pandas-heavy code would need many ignores.
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No type information shipped (torchvision, scikit-learn) or no stubs installed (PyYAML).
module = ["torchvision", "torchvision.*", "sklearn", "sklearn.*", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# nibabel's annotations are partial (images load as FileBasedImage without shape or affine), so it
# is treated as untyped.
module = ["nibabel", "nibabel.*"]
follow_imports = "skip"
follow_untyped_imports = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
# MONAI re-exports its classes from package __init__ files without __all__.
module = ["monai", "monai.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# dvc ships no type information; used only by a repo setup test.
module = ["dvc", "dvc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "real_data: needs the DVC outputs under data/ (skipped if absent)",
]
